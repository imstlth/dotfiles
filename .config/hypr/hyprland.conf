#######
# ENV #
#######

env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_LIBRARY_NAME,nvidia
env = HYPRCURSOR_THEME,Breeze_Dark_Default
env = HYPRCURSOR_SIZE,24
env = XDG_PICTURES_DIR,/home/caracole/Pictures
env = XDG_CONFIG_HOME,/home/caracole/.config
env = QT_QPA_PLATFORM,wayland
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that
env = GDK_SCALE,2
env = XCURSOR_SIZE,24

cursor {
	no_hardware_cursors = true
}
xwayland {
	force_zero_scaling = true
}

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = eDP-1, 1920x1080@120, 0x0, 1
# La télé de papa en 4K qui fait bugger mon PC
monitor = HDMI-A-3, 1920x1080@60, 1920x0, 1
# monitor = , preferred@60, auto, 1
monitor = , 1920x1080@120, auto, 1


##########
# CONFIG #
##########

input {
	kb_layout = fr
	kb_variant = oss
	kb_model =
	kb_options = nbsp:none
	kb_rules =
	numlock_by_default = no

	follow_mouse = 1

	touchpad {
		natural_scroll = yes
		scroll_factor = 0.4
	}

	sensitivity = 0 # -1.0 to 1.0, 0 means no modification.
}

general {

	gaps_in = 6
	gaps_out = 12
	border_size = 3
# PT DE REPERE, NE PAS CHANGER
  col.active_border = rgba(1ba6faff) rgba(2ac3deff) 174deg
	col.inactive_border = rgba(1a1b26e0)

	layout = hy3

	allow_tearing = false
}

decoration {
	rounding = 10

	# En vrai c'est chiant d'avoir plein de fenêtres transparentes
	# Faut être honnête
	active_opacity = 1 # 0.88
	inactive_opacity = 1 # 0.88
	fullscreen_opacity = 1

	blur {
		enabled = yes
		size = 6
		passes = 2
		xray = no
	}

	shadow {
		enabled = no
	}
}

# Honteusement volé
animations {
	enabled = true

	# Animation curves
	bezier = specialWorkSwitch, 0.05, 0.7, 0.1, 1
	bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
	bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
	bezier = standard, 0.2, 0, 0, 1

	# Animation configs
	animation = layersIn, 1, 5, emphasizedDecel, slide
	animation = layersOut, 1, 4, emphasizedAccel, slide
	animation = fadeLayers, 1, 5, standard

	animation = windowsIn, 1, 5, emphasizedDecel
	animation = windowsOut, 1, 3, emphasizedAccel
	animation = windowsMove, 1, 6, standard
	animation = workspaces, 1, 5, standard

	animation = specialWorkspace, 1, 4, specialWorkSwitch, slidefadevert 15%

	animation = fade, 1, 6, standard
	animation = fadeDim, 1, 6, standard
	animation = border, 1, 6, standard
}

dwindle {
	pseudotile = yes
	force_split = 2
	preserve_split = yes
	smart_split = yes
}

misc {
	force_default_wallpaper = 0
	disable_hyprland_logo = yes
	focus_on_activate = yes
	vfr = yes
	vrr = 2
}

render {
	direct_scanout = false
}

group {
	col.border_active = rgba(bb9af7ff) rgba(f7768eff) 45deg
	col.border_inactive = rgba(59565f89)

	groupbar {
		font_family = SourceCodePro
		font_size = 12
		col.active = rgba(bb9af789)
		col.inactive = rgba(59565f89)
	}
}

binds {
	workspace_back_and_forth = yes
	allow_workspace_cycles = yes
}


############
# GESTURES #
############

gesture = 3, horizontal, workspace
gesture = 3, horizontal, mod: CTRL, move
gesture = 3, pinchout, dispatcher, exec, prime-run librewolf
gesture = 3, pinchin, dispatcher, exec, prime-run kitty -1
gesture = 3, up, fullscreen
gesture = 3, down, close


###############
# WINDOWRULES #
###############

windowrule = match:class .*, suppress_event maximize # Empêche libreoffice de faire son truc bizarre de prendre le dessus sur les autres fenêtres
windowrule = match:class engrampa, float on
windowrule = match:class blueman-manager, float on
windowrule = match:class com.github.hluk.copy, float on
windowrule = match:class org.qbittorrent.qBittorrent, float on
windowrule = match:class wev, float on
windowrule = match:title .*Renommer.*, float on
windowrule = match:class file-jpeg, float on
windowrule = match:title Opération sur des fichiers en cours, float on
# windowrule = match:class librewolf, opaque on
# windowrule = match:class chromium, opaque on
# windowrule = match:class tidal-hifi, opaque on
# windowrule = match:class Google Earth Pro, opaque on
# windowrule = match:class swappy, opaque on
# windowrule = match:class ristretto, opaque on
# windowrule = match:class kitty, opaque on
# windowrule = match:class mpv, opaque on
# windowrule = match:class org.gnome.Evince, opaque on
# windowrule = match:class gimp, opaque on
# windowrule = match:fullscreen true, opaque on override

# En fait le problème c'est que kitty gère son propre fond
# la transparence de hyprland n'est pas que sur le fond mais sur toute la fenêtre
# même le texte et les images sont transparentes
# kitty peut mettre juste son fond en transparent
# c'est pour ça qu'il est en opaque sur hyprland
# mais en fullscreen, il ne change pas le fond du coup et c'est chiant

#########
# BINDS #
#########

$mainMod = SUPER

# C'est la même touche que pour Lethal Company donc on rajoute SHIFT
bind = SHIFT, code:49, exec, /home/caracole/.config/hypr/gamemode.sh

# Chercher le wifi
bind = $mainMod, W, exec, iwctl station wlan0 scan

# Changer le volume de 5%
binde = , XF86AudioRaiseVolume, exec, /home/caracole/Code/volume.fish 5%+
binde = , XF86AudioLowerVolume, exec, /home/caracole/Code/volume.fish 5%-
# Changer le volume de 1%
binde = CTRL, XF86AudioRaiseVolume, exec, /home/caracole/Code/volume.fish 1%+
binde = CTRL, XF86AudioLowerVolume, exec, /home/caracole/Code/volume.fish 1%-
# Passer à la musique suivante
bind = SHIFT, XF86AudioRaiseVolume, exec, playerctl next
bind = SHIFT, XF86AudioLowerVolume, exec, playerctl previous
# Mettre en muet
# bind = , XF86AudioMute, exec, /home/caracole/Code/volume.fish mute
# Changer la luminosité
binde = , XF86MonBrightnessUp, exec, sudo /home/caracole/Code/brightness_up.fish
binde = , XF86MonBrightnessDown, exec, sudo /home/caracole/Code/brightness_down.fish
# Mettre en pause
bind = , XF86AudioPlay, exec, playerctl play-pause
# Changer le fond d'écran
bind = SHIFT, XF86AudioPlay, exec, /home/caracole/Code/change_bg.fish
# Toutes les commandes de capture d'écran

# Permet de ne pas avoir de barre noire sur le screenshot
layerrule = match:namespace selection, no_anim on
bind = , Print, exec, slurp -d | grim -g - - | swappy -f -
bind = SHIFT, Print, exec, grim - | swappy -f -
bind = CTRL, Print, exec, grim

bind = $mainMod, Return, exec, prime-run kitty -1
bind = $mainMod, Q, killactive,
bind = $mainMod + SHIFT, Q, exec, shutdown now
bind = $mainMod + CTRL, Q, exec, reboot
# bind = $mainMod + SHIFT, E, exit,
bind = $mainMod + SHIFT, Space, togglefloating,
bind = $mainMod + CTRL, Space, pin,
bind = $mainMod, E, hy3:makegroup, tab, toggle
bind = $mainMod, R, exec, rofi -show-icons -show drun
bind = $mainMod + SHIFT, R, exec, rofi -show run
bind = $mainMod, Space, pseudo
# bind = $mainMod, Z, togglesplit, # dwindle - c'est devenu plus intuitif mtn
bind = $mainMod + SHIFT, H, hy3:movewindow, l
bind = $mainMod + SHIFT, J, hy3:movewindow, d
bind = $mainMod + SHIFT, K, hy3:movewindow, u
bind = $mainMod + SHIFT, L, hy3:movewindow, r
bind = $mainMod + CTRL, L, hy3:focustab, r, wrap
bind = $mainMod + CTRL, H, hy3:focustab, l, wrap
bind = $mainMod, Z, hy3:makegroup, v, toggle
bind = $mainMod + SHIFT, Z, hy3:makegroup, h, toggle

bind = , XF86Calculator, exec, prime-run librewolf

bind = $mainMod, N, submap, launcher
submap = launcher
bind = , F, exec, thunar
bind = , A, exec, prime-run stellarium
bind = , G, exec, prime-run gimp
bind = , L, exec, lowriter
# Mec, pavucontrol fait du coil whining de fou jsp pk
bind = , P, exec, pavucontrol
bind = , M, exec, meld
bind = , K, exec, anki
bind = , T, exec, prime-run tidal-hifi --enable-features=UseOzonePlatform --ozone-platform=wayland
bind = , catchall, submap, reset
submap = reset

# Move focus with mainMod + arrow keys
bind = $mainMod, H, hy3:movefocus, l, visible
bind = $mainMod, L, hy3:movefocus, r, visible
bind = $mainMod, K, hy3:movefocus, u, visible
bind = $mainMod, J, hy3:movefocus, d, visible

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod, code:17, workspace, 8
bind = $mainMod, code:18, workspace, 9
bind = $mainMod, code:19, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, code:10, movetoworkspace, 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4
bind = $mainMod SHIFT, code:14, movetoworkspace, 5
bind = $mainMod SHIFT, code:15, movetoworkspace, 6
bind = $mainMod SHIFT, code:16, movetoworkspace, 7
bind = $mainMod SHIFT, code:17, movetoworkspace, 8
bind = $mainMod SHIFT, code:18, movetoworkspace, 9
bind = $mainMod SHIFT, code:19, movetoworkspace, 10

# Fullscreen
bind = $mainMod, F, fullscreen, 0

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace
bind = $mainMod SHIFT, S, movetoworkspace, special

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


#############
# AUTOSTART #
#############

exec-once = hyprpm reload
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = blueman-applet
exec-once = copyq --start-server
# Ça marche ?
# C'est pour lancer les appli X sur wayland avec sudo (contre erreur cannot open display)
exec-once = xhost +SI:localuser:root
exec-once = /home/caracole/Code/battery.fish
# Plus besoin de watchtime en prépa mdr
#exec-once = /home/caracole/Code/watchtime.fish
#exec-once = prime-run alacritty --daemon
# On execute waybar dans change_bg
# Plus maintenant
exec-once = waybar > /tmp/waybar.log

exec-once = /home/caracole/Code/bg_day.fish
